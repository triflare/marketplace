name: 'TwextHub'
version: '3.1.1'
tagline: 'A lightweight registry of Twext-compiled extensions ("Twexts") for use in TurboWarp'
author: 'Twext Team'
homepage: 'https://github.com/twextjs/twexthub'
branding:
  colors:
    primary: '#16A34A'
    secondary: '#12823B'
    tertiary: '#0D602C'
symbols:
  success: '✓'
  error: '✗'
  progress: '~'
  bullet: '•'
defaults:
  configFilename: 'config.yaml'
  apiRoot: '/v2'
  fallbackColor: '#0070F3'
