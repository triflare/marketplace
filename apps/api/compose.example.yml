services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triflare
      POSTGRES_PASSWORD: triflare
      POSTGRES_DB: triflare
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U triflare']
      interval: 5s
      timeout: 5s
      retries: 10

  hub:
    build: .
    ports:
      - '3000:3000'
    volumes:
      # Holds published blobs and the config.yaml the setup screen writes.
      - triflare-data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  triflare-data:
