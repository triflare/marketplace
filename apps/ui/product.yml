# The app's identity. The build reads this once and inlines the values into both
# bundles, so a rebrand is a change here plus a rebuild.
name: "Triflare Marketplace"
version: "1.3.0-alpha.2"
tagline: "Find extensions, and share yours."
author: "Triflare"
homepage: "https://github.com/triflare/marketplace"
extend:
  name: "Triflare Extend"
  package: "@triflare/extend"
  command: "extend"
  configFilename: "extend.yml"
branding:
  colors:
    primary: "#FFEA35"
    secondary: "#F1C40F"
    tertiary: "#CB9E00"
# The official instance the app falls back to outside development.
defaults:
  apiUrl: "https://marketplace.sdisk.us/api/v1"
