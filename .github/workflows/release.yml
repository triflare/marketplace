name: Release

on:
  push:
    branches: [latest, beta, alpha]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: triflare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d triflare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: triflare
          repositories: marketplace
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/ui/package-lock.json
      - name: Install release dependencies
        run: npm ci
      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api
      - name: Install UI dependencies
        run: npm ci
        working-directory: apps/ui
      - name: Check API formatting
        run: npm run format:check
        working-directory: apps/api
      - name: Lint API
        run: npm run lint
        working-directory: apps/api
      - name: Test API
        run: npm test
        working-directory: apps/api
      - name: Check UI formatting
        run: npm run format:check
        working-directory: apps/ui
      - name: Lint UI
        run: npm run lint
        working-directory: apps/ui
      - name: Typecheck UI
        run: npm run typecheck
        working-directory: apps/ui
      - name: Test UI
        run: npm test
        working-directory: apps/ui
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "released=false" >> "$GITHUB_OUTPUT"
          npx semantic-release
