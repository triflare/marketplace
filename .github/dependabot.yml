version: 2
updates:
  # The root package holds the release tooling; each app resolves its own
  # dependencies, so all three get an entry.
  - package-ecosystem: 'npm'
    directory: '/'
  - package-ecosystem: 'npm'
    directory: '/apps/api'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    directory: '/apps/ui'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'docker'
    directory: '/apps/api'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'docker'
    directory: '/apps/ui'
    schedule:
      interval: 'daily'
  # The root compose file pins postgres:16-alpine; the other two Dockerfiles
  # are covered by the entries above.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'daily'
